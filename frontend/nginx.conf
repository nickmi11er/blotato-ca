server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fixed workspace boundary for the local take-home deployment. The browser
    # cannot select another workspace or invoke account registration/internal jobs.
    location ~ ^/api/(catalog|automations|templates)(/[a-zA-Z0-9_-]+)?(/publish|/disable)?$ {
        rewrite ^/api/(.*)$ /v1/workspaces/${AUTOMATION_WORKSPACE_ID}/$1 break;
        proxy_pass http://backend:8080;
        proxy_set_header Authorization "Bearer ${AUTOMATION_API_TOKEN}";
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
        client_max_body_size 256k;
        add_header Cache-Control "no-store" always;
    }
    location /api { return 404; }
    location / { try_files $uri $uri/ /index.html; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
