database:
  url: postgres://automation:local@127.0.0.1:25432/automation?sslmode=disable

messaging:
  broker:
    - 127.0.0.1:29094
  topic: social.inbound
  partitions: 3
  rules_topic: automation.rules
  group_id: comment-automation

# Internal API credential for local development only.
http:
  address: "127.0.0.1:8080"
  token: local-development-internal-token

matching:
  max_bytes: 67108864
  idle_ttl: 20m
  fresh_ttl: 1m
  negative_ttl: 15s
  load_timeout: 5s
  max_loads: 16
  maintenance_interval: 5s
  reconcile_batch: 256

execution:
  workers: 4
  poll_interval: 500ms
  lease: 30s
  job_timeout: 10s
  max_attempts: 5

conversations:
  max_bytes: 8388608
  idle_ttl: 20m
  fresh_ttl: 1m
  negative_ttl: 15s

# Local-only: stores requests in recorded_deliveries, never sends real messages.
# Set mode: http and provide url/token for a real integration.
delivery:
  mode: recording
  idempotency: true
